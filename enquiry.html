<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siyabonga Africa | Volunteer & Sponsor Enquiry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Get Involved</h1>
        <nav>
            <a href="Home page.html">Home</a>
            <a href="about us.html">About Us</a>
            <a href="Services.html">Programmes</a>
            <a href="enquiry.html" class="active">Get Involved</a>
            <a href="contact us.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="form-container">
            <h2>Enquiry Form</h2>
            <p>Partner with us or volunteer your time to make a tangible difference in local communities.</p>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="type">Interest Type:</label>
                    <select id="type" name="type">
                        <option value="volunteer">Volunteer</option>
                        <option value="sponsor">Corporate Sponsor / CSI</option>
                        <option value="donor">Individual Donor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="How would you like to contribute?"></textarea>
                </div>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Siyabonga Africa NPO. All Rights Reserved.</p>
    </footer>
</body>
</html>
